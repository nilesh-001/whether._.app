<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bodyContainer">
    
    <div class="title">

      <div class="logo">
        <img src="assets/images/logo.svg" alt="Logo">
      </div>

      <div class="units">
        <img src="assets/images/icon-units.svg" alt="Units Icon" id="unitIcon">
        <select id="unitSelect">
          <option value="metric" selected>Units</option>
          <option value="metric">Celsius (°C)</option>
          <option value="imperial">Fahrenheit (°F)</option>
          <option value="standard">Kelvin (K)</option>
        </select>
      </div>
    </div>
    
    
    <div class="about">How's the sky looking today?</div>
    
    
    <div class="searchContainer">
      <div class="search-Bar">
        <input type="text" class="search-input" name="search-bar" placeholder="Search for a place..." id="search">
        <button class="search-button">Search</button>
      </div>
    </div>


    <div class="forecast">
      <div class="left-side">
        
        <div class="location">
            <div class="loc-info">
              
              <div class="left">
                <div class="add">
                  <div id="city"></div>,
                  <div id="country"></div>
                </div>
                <div class="date">
                  <div id="day"></div>,
                  <div id="date_month"></div>,
                  <div id="year"></div>
                </div>
              </div>

              <div class="right">
                <div class="icon">
                  <img src="" alt="">
                </div>
                <div id="tem"></div>
              </div>
              
            </div>
          </div>
          
          
          <div class="information">
            <div class="o_inf">
              <div class="box">Feels Like</div>
              <div class="value" id="temp"></div>
            </div>
            <div class="o_inf">
              <div class="box">Humidity</div>
              <div class="value" id="humidity"></div>
            </div>
            <div class="o_inf">
              <div class="box">Wind</div>
              <div class="value" id="wind"></div>
            </div>
            <div class="o_inf">
              <div class="box">Precipitation</div>
              <div class="value" id="precipitation"></div>
            </div>
          </div>
          
          <div class="dailyForecast">
            <div class="daily">
              Daily forecast
            </div>
              <div class="days">
                <div class="card">
                  <div class="day" id="day_1"></div>
                  <div class="weather_type" id="weather_1"></div>
                  <div class="temperature">
                    <div class="max" id="max_1"></div>
                    <div class="min" id="min_1"></div>
                  </div>
                </div>
                <div class="card">
                  <div class="day"id="day_2"></div>
                  <div class="weather_type" id="weather_2"></div>
                  <div class="temperature">
                    <div class="max" id="max_2"></div>
                    <div class="min" id="min_2"></div>
                  </div>
                </div>
                <div class="card">
                  <div class="day"id="day_3"></div>
                  <div class="weather_type" id="weather_3"></div>
                  <div class="temperature">
                    <div class="max" id="max_3"></div>
                    <div class="min" id="min_3"></div>
                  </div>
                </div>
                <div class="card">
                  <div class="day"id="day_4"></div>
                  <div class="weather_type" id="weather_4"></div>
                  <div class="temperature">
                    <div class="max" id="max_4"></div>
                    <div class="min" id="min_4"></div>
                  </div>
                </div>
                <div class="card">
                  <div class="day"id="day_5"></div>
                  <div class="weather_type" id="weather_5"></div>
                  <div class="temperature">
                    <div class="max" id="max_5"></div>
                    <div class="min" id="min_5"></div>
                  </div>
                </div>
                <div class="card">
                  <div class="day"id="day_6"></div>
                  <div class="weather_type" id="weather_6"></div>
                  <div class="temperature">
                    <div class="max" id="max_6"></div>
                    <div class="min" id="min_6"></div>
                  </div>
                </div>
              </div>
          </div>


      </div>
      <div class="right-side">
        <div id="hourly-forecast">
        </div>
      </div>
    </div>
  </div>

  <script src="index.js"></script>

</body>  
</html>
